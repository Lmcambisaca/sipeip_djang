{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva contraseña - SIPeIP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<section class="vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        {% if validlink %}
                            <h3 class="text-center mb-4">Crear nueva contraseña</h3>
                            <form method="post">
                                {% csrf_token %}
                                {{ form.as_p }}
                                <button type="submit" class="btn btn-primary w-100">
                                    Guardar contraseña
                                </button>
                            </form>
                        {% else %}
                            <h3 class="text-center">Enlace no válido</h3>
                            <p>El enlace venció o ya fue utilizado. Solicita uno nuevo.</p>
                            <a href="{% url 'recuperar_password' %}" class="btn btn-primary">
                                Solicitar otro enlace
                            </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>

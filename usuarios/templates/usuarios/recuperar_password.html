{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - SIPeIP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <section class="vh-100 d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">
        
                <div class="card shadow">
        
                    <div class="card-body p-5">
        
                        <div class="text-center mb-4">
        
                            <img
                                src="https://www.presidencia.gob.ec/wp-content/uploads/2025/10/secretaria_nacional_planificacion_desarrollo_senplades_sipeip3.jpg"
                                class="img-fluid"
                                style="max-height:110px;"
                                alt="SIPeIP">
        
                            </div>

                        <h3 class="text-center mb-3">Recuperar contraseña</h3>
                        <p class="text-muted text-center">
                            Ingresa el correo de tu cuenta. Te enviaremos un enlace para crear una nueva contraseña.
                        </p>

                        <form method="post">
        
                            {% csrf_token %}

                            <label for="id_email" class="form-label">Correo electrónico</label>
                            <input
                                type="email"
                                name="email"
                                id="id_email"
                                class="form-control"
                                maxlength="254"
                                autocomplete="email"
                                required
                                value="{{ form.email.value|default_if_none:'' }}">

                            {% for error in form.email.errors %}
                                <div class="text-danger small mt-1">{{ error }}</div>
                            {% endfor %}

                            <button type="submit" class="btn btn-primary w-100 mt-4">
                                <i class="fas fa-envelope"></i>
                                Enviar enlace
                            </button>
        
                        </form>

                        <div class="text-center mt-4">
        
                            <a href="{% url 'login' %}">
                                <i class="fas fa-arrow-left"></i>
                                Volver al login
                            </a>
        
                        </div>
        
                    </div>
        
                </div>
        
            </div>
        
        </div>
    
    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
